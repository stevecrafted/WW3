version: '3.8'

services:
  web:
    build: .
    container_name: iranwatch_web
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=ww3
      - DB_USER=ww3
      - DB_PASSWORD=ww3

  db:
    image: mysql:8.0.45
    container_name: iranwatch_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ww3
      MYSQL_USER: ww3
      MYSQL_PASSWORD: ww3
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uww3", "-pww3"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
