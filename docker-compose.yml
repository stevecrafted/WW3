version: '3.8'

services:
  web:
    build: .
    container_name: iranwatch_web
    ports:
      - "8081:80"  
    volumes:
      - .:/var/www/html 
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=ww3
      - DB_USER=user
      - DB_PASSWORD=steve

  db:
    image: mysql:8.0.45
    container_name: iranwatch_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ww3
      MYSQL_USER: user
      MYSQL_PASSWORD: steve
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d   # Exécute tous les fichiers SQL au démarrage
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: